<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Makola verification code</title>
  </head>
  <!-- Inline styles only: email clients strip <style> blocks and ignore
       external stylesheets. Tables, not flexbox, for the same reason. -->
  <body style="margin:0;padding:0;background:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background:#f4f4f5;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px;background:#ffffff;border-radius:12px;
                        padding:32px 28px;font-family:Arial,Helvetica,sans-serif;">
            <tr>
              <td style="font-size:20px;font-weight:bold;color:#111827;padding-bottom:8px;">
                Makola
              </td>
            </tr>
            <tr>
              <td style="font-size:15px;color:#374151;line-height:22px;padding-bottom:20px;">
                Here is your verification code. Enter it in the app to finish
                setting up your account.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <div style="display:inline-block;background:#f4f4f5;border-radius:10px;
                            padding:16px 28px;font-size:32px;font-weight:bold;
                            letter-spacing:8px;color:#111827;">
                  {{code}}
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;color:#6b7280;line-height:21px;">
                It expires in {{minutes}} minutes. If you did not ask for this
                code, you can ignore this email - nothing will change.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
